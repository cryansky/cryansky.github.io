<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under Construction</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --green: #00ff41;
      --green-dim: #16a34a;
    }

    html, body {
      font-family: "SF Mono", "Fira Code", "JetBrains Mono", Consolas, "Courier New", monospace;
      background: #000000;
      color: var(--green);
      min-height: 100vh;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .terminal {
      max-width: 480px;
      width: 100%;
      border: 1px solid rgba(0, 255, 65, 0.25);
      border-radius: 4px;
      padding: 1.75rem;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    h1::before {
      content: "> ";
      color: var(--green-dim);
    }

    p.desc {
      font-size: 0.85rem;
      color: var(--green-dim);
      line-height: 1.6;
      margin-bottom: 1.25rem;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(0, 255, 65, 0.06);
      border: 1px solid rgba(0, 255, 65, 0.2);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 0.4rem;
    }

    .progress-fill {
      height: 100%;
      width: 65%;
      background: var(--green);
    }

    .progress-label {
      font-size: 0.75rem;
      color: var(--green-dim);
      margin-bottom: 1.5rem;
    }

    .notify {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .notify input {
      flex: 1;
      background: transparent;
      border: 1px solid rgba(0, 255, 65, 0.3);
      border-radius: 4px;
      padding: 0.6rem 0.8rem;
      color: var(--green);
      font-family: inherit;
      font-size: 0.85rem;
      outline: none;
    }

    .notify input::placeholder {
      color: #166534;
    }

    .notify input:focus {
      border-color: var(--green);
    }

    .notify button {
      background: var(--green);
      color: #000000;
      font-weight: 700;
      font-family: inherit;
      font-size: 0.85rem;
      border: none;
      border-radius: 4px;
      padding: 0.6rem 1rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .footer {
      font-size: 0.78rem;
      color: var(--green-dim);
      border-top: 1px solid rgba(0, 255, 65, 0.2);
      padding-top: 1rem;
    }

    .footer a {
      color: var(--green);
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="terminal">
    <h1>We're building something new</h1>
    <p class="desc">This page is currently under construction. We're working hard to bring it to life &mdash; check back soon for updates.</p>

    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>
    <div class="progress-label">65% complete</div>

    <form class="notify" onsubmit="event.preventDefault(); const btn=this.querySelector('button'); btn.textContent='Subscribed'; btn.disabled=true;">
      <input type="email" placeholder="you@email.com" required aria-label="Email address" />
      <button type="submit">Notify me</button>
    </form>

    <div class="footer">
      Questions? <a href="mailto:hello@example.com">Contact us</a>
    </div>
  </div>
</body>
</html>
