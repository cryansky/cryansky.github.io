<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under Construction</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "SF Mono", "Fira Code", "JetBrains Mono", Consolas, "Courier New", monospace;
      background: #000000;
      color: #33ff33;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 255, 0, 0.03),
        rgba(0, 255, 0, 0.03) 1px,
        transparent 1px,
        transparent 2px
      );
      pointer-events: none;
      z-index: 2;
    }

    .glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      pointer-events: none;
    }

    .glow-1 {
      width: 380px;
      height: 380px;
      background: #00ff41;
      top: -120px;
      left: -120px;
      animation: drift 12s ease-in-out infinite;
    }

    .glow-2 {
      width: 320px;
      height: 320px;
      background: #00cc33;
      bottom: -140px;
      right: -100px;
      animation: drift 14s ease-in-out infinite reverse;
    }

    @keyframes drift {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(30px, 20px); }
    }

    .container {
      max-width: 480px;
      position: relative;
      z-index: 3;
      animation: fadeUp 0.8s ease-out;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #00ff41;
      background: rgba(0, 255, 65, 0.08);
      border: 1px solid rgba(0, 255, 65, 0.35);
      border-radius: 4px;
      padding: 0.35rem 0.9rem;
      margin-bottom: 1.5rem;
      text-shadow: 0 0 8px rgba(0, 255, 65, 0.6);
    }

    .badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #00ff41;
      box-shadow: 0 0 6px #00ff41;
      animation: pulse 1.6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.7); }
    }

    .icon {
      font-size: 3.5rem;
      margin-bottom: 1.5rem;
      animation: bounce 3s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-6px) rotate(3deg); }
    }

    h1 {
      font-size: 1.9rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      letter-spacing: -0.01em;
      color: #33ff33;
      text-shadow: 0 0 10px rgba(51, 255, 51, 0.5), 0 0 2px rgba(51, 255, 51, 0.8);
    }

    h1::before {
      content: "> ";
      color: #00cc33;
    }

    h1::after {
      content: "_";
      animation: pulse 1s step-end infinite;
    }

    p {
      font-size: 1rem;
      color: #4ade80;
      line-height: 1.6;
      margin-bottom: 2rem;
      opacity: 0.85;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: rgba(0, 255, 65, 0.08);
      border: 1px solid rgba(0, 255, 65, 0.2);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 0.6rem;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 65%;
      background: #00ff41;
      box-shadow: 0 0 10px #00ff41;
      border-radius: 2px;
      position: relative;
      overflow: hidden;
    }

    .progress-fill::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      animation: shimmer 1.8s linear infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .progress-label {
      font-size: 0.8rem;
      color: #16a34a;
      margin-bottom: 2rem;
      text-align: right;
    }

    .notify {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.75rem;
    }

    .notify input {
      flex: 1;
      background: rgba(0, 255, 65, 0.04);
      border: 1px solid rgba(0, 255, 65, 0.3);
      border-radius: 4px;
      padding: 0.65rem 0.9rem;
      color: #33ff33;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .notify input::placeholder {
      color: #166534;
    }

    .notify input:focus {
      border-color: #00ff41;
      box-shadow: 0 0 8px rgba(0, 255, 65, 0.3);
    }

    .notify button {
      background: #00ff41;
      color: #000000;
      font-weight: 700;
      font-family: inherit;
      font-size: 0.9rem;
      border: none;
      border-radius: 4px;
      padding: 0.65rem 1.1rem;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      white-space: nowrap;
    }

    .notify button:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 16px rgba(0, 255, 65, 0.6);
    }

    .notify button:active {
      transform: translateY(0);
    }

    .footer {
      font-size: 0.85rem;
      color: #16a34a;
    }

    .footer a {
      color: #00ff41;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 1rem;
    }

    .socials a {
      color: #166534;
      font-size: 0.85rem;
      text-decoration: none;
      transition: color 0.2s;
    }

    .socials a:hover {
      color: #00ff41;
    }
  </style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <div class="container">
    <span class="badge"><span class="dot"></span> access_granted</span>
    <div class="icon">💻</div>
    <h1>We're building something new</h1>
    <p>This page is currently under construction. We're working hard to bring it to life &mdash; check back soon for updates.</p>

    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>
    <div class="progress-label">65% complete</div>

    <form class="notify" onsubmit="event.preventDefault(); const btn=this.querySelector('button'); btn.textContent='Subscribed ✓'; btn.disabled=true;">
      <input type="email" placeholder="you@email.com" required aria-label="Email address" />
      <button type="submit">Notify me</button>
    </form>

    <div class="footer">
      Questions? <a href="mailto:hello@example.com">Contact us</a>
      <div class="socials">
        <a href="#" aria-label="Twitter">Twitter</a>
        <a href="#" aria-label="GitHub">GitHub</a>
        <a href="#" aria-label="LinkedIn">LinkedIn</a>
      </div>
    </div>
  </div>
</body>
</html>
</content>
